name: "DTS Issue"
description: Create a new issue meeting DTS standards.
title: "Begin with a verb and summarize the work to be completed"
labels:
  - "[Project] or [Service] :x: MISSING"
  - "[Product] - if applicable"
type: Task
body:
  - type: markdown
    attributes:
      value: |
        See the [DTS issue standards](https://atd-dts.gitbook.io/wiki/product-ops/github-project-management#issues) for more information.
  - type: textarea
    id: description
    attributes:
      label: .
      description: What needs to be done, and why?
    validations:
      required: true
