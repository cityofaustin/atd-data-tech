# .github/ISSUE_TEMPLATE/all-purpose-project-index.yml
name: "Form: Project Index"
description: "Essential information for all DTS projects. Feeds the DTS website and the DTS Portfolio GitHub Project."
title: "Project: [Your Project Name in Title Case]"
type: Project
projects: ["cityofaustin/27"]
labels: []
assignees: []

body:
  # ---------------------------------------------------------------------------
  # `markdown` blocks show in the form but are NOT submitted with the issue.
  # Use them for instructions; use field `description`s for per-field guidance.
  # ---------------------------------------------------------------------------
  - type: textarea
    id: description
    attributes:
      label: Description
      description: |
        **Begin with a verb** and summarize the project concisely, identifying the stakeholders/users as well as the intended outcome. Keep it jargon- and acronym-free—a TPW staff person, a Council member, or a prospective DTS intern should be able to understand it. **255 characters max**—this is copied verbatim into the `DTS Description` issue field.

        Examples:
        - *Add a warehouse inventory module to Signs & Markings Data Tracker to track inventory in real time, view turnover rates, and give the TPW Finance division visibility into these expenditures*
        - *Use ArcGIS Hub to build Dash 2.0, a central point to find TPW's authoritative dashboards, maps, and datasets.*
      placeholder: "Build/Implement/Evaluate/Migrate ... for ... so that ..."
    validations:
      required: true
      
  - type: textarea
    id: background
    attributes:
      label: Background
      description: Clarify the organizational/operational context of this work.
    validations:
      required: false

  - type: textarea
    id: desired-outcomes
    attributes:
      label: Desired Outcomes
      description: Beyond the deliverables themselves, what will be different when this work is complete? What metrics are we using to measure success?
    validations:
      required: false

  - type: textarea
    id: scope-deliverables
    attributes:
      label: Scope & Deliverables
      description: What platform? What's in scope, and (importantly!) what isn't? Are there constraints or potential roadblocks/challenges?
    validations:
      required: false

  - type: textarea
    id: references
    attributes:
      label: References
      description: Helpful documents and links for easy reference.
      value: |
        - Drive folder:
        - Miro board:
    validations:
      required: false

  - type: input
    id: requested-by
    attributes:
      label: Requested by
      placeholder: Name (first name and last name initial), division
    validations:
      required: false

  - type: input
    id: executive-sponsor
    attributes:
      label: Executive sponsor
      placeholder: Name (first name and last name initial), title
    validations:
      required: false

  - type: textarea
    id: image
    attributes:
      label: Image
      description: |
        The first image in this issue is the project's thumbnail on the DTS website. The Austin checkered brand pattern is pre-filled as the default. To use your own, drag and drop an image that follows the [index issue image guidelines](https://atd-dts.gitbook.io/wiki/product-ops/index-issue-specifications#index-issue-images) and **delete the default line** so yours is first. Good sources: the DTS docs image library, the TPW Flickr, or the DTS image stash folder.
      # Pinned to a commit SHA so the image keeps resolving even if the file moves later.
      value: |
        ![Austin checkered brand pattern](https://raw.githubusercontent.com/cityofaustin/atd-data-tech/d8bbf33930190731d784d21ac2674b617c0f19ef/images/index%20images/Austin%20Checkered%20Brand%20Pattern.png)
    validations:
      required: true
      
  - type: textarea
    id: footer
    attributes:
      label: About this issue
      description: Leave as-is. This boilerplate appears on every project index issue.
      value: |
        This GitHub issue represents a [Data & Technology Services](https://austinmobility.io/) project for [Austin Transportation and Public Works](https://www.austintexas.gov/transportation-public-works). Project status is documented regularly in the comments below.
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        ### After you submit
        Issue fields, labels, and project membership can't be set by this form, so a few manual steps remain.

  - type: checkboxes
    id: after-submit
    attributes:
      label: Follow-up checklist
      options:
        - label: "Check the sidebar: the DTS issue fields are filled in automatically from the answers above, but a bad date or an over-long description gets skipped (see the Actions run). Set `DTS Status`."
        - label: "Create a new `Project:` label at https://github.com/cityofaustin/atd-data-tech/labels (hex `#3D3D3D`) and apply it here"
